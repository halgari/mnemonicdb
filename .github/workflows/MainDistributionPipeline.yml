#
# Builds, tests and checks the extension with DuckDB's extension CI tools. The DuckDB and extension-ci-tools
# commits match the pinned submodules.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-main-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a68570fde10384547868301a12327d5c67909527
    with:
      duckdb_version: 2bb5316a8b59904a5dc513b88b81b048e25bbcc5
      ci_tools_version: a68570fde10384547868301a12327d5c67909527
      extension_name: mnemonicdb
      # RocksDB needs threads and a real filesystem, so WebAssembly would need a port of its own. RocksDB also needs
      # GCC 11+ for C++20, and the MinGW toolchain (Rtools 42) ships GCC 10.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@a68570fde10384547868301a12327d5c67909527
    with:
      duckdb_version: 2bb5316a8b59904a5dc513b88b81b048e25bbcc5
      ci_tools_version: a68570fde10384547868301a12327d5c67909527
      extension_name: mnemonicdb
      format_checks: 'format;tidy'
